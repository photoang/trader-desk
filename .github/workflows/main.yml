name: 更新資料並部署

on:
  schedule:
    # GitHub 排程用 UTC，台北時間 = UTC + 8。排程可能延遲 5 到 30 分鐘。
    - cron: "10 23 * * 0-4"   # 台北 07:10（週一到週五）
    - cron: "40 0 * * 1-5"    # 台北 08:40
    - cron: "0 4 * * 1-5"     # 台北 12:00
    - cron: "40 7 * * 1-5"    # 台北 15:40 三大法人、期貨未平倉、P/C Ratio
    - cron: "20 9 * * 1-5"    # 台北 17:20 補抓
    - cron: "50 13 * * 1-5"   # 台北 21:50 融資融券
    - cron: "40 15 * * 1-5"   # 台北 23:40 美股開盤後
    - cron: "0 1 * * 0,6"     # 週末 台北 09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取資料
        run: python scripts/fetch.py

      - name: 儲存資料到 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "更新資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
